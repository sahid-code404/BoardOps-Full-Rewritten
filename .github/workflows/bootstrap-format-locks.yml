name: Bootstrap formatting and lockfiles

on:
  push:
    branches: ['phase/01-architecture']

permissions:
  contents: write

concurrency:
  group: phase-01-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/01-architecture

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Resolve Node dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format repository
        run: pnpm format

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve Flutter lockfile
        working-directory: apps/mobile
        run: flutter pub get

      - name: Normalize Flutter config formatting
        run: pnpm exec prettier --write apps/mobile/analysis_options.yaml apps/mobile/pubspec.yaml

      - name: Commit deterministic formatting and lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No bootstrap changes required.'
            exit 0
          fi
          git commit -m 'chore: format Phase 01 and lock dependencies'
          git push origin HEAD:phase/01-architecture
