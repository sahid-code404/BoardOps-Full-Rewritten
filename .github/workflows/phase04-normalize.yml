name: Phase 04 normalize

on:
  push:
    branches: ['phase/04-authentication-foundation']
    paths:
      - '.github/workflows/phase04-normalize.yml'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format Node and web sources
        run: |
          pnpm prettier --write services/api/src/auth services/api/src/dev apps/web/src/features/auth apps/web/src/styles/auth.css scripts/auth-smoke.mjs packages/api-contract/openapi/boardops-v1.yaml docs/api/CONTRACT.md package.json services/api/package.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Resolve and format Flutter authentication
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format lib/features/auth lib/routing/app_router.dart test/app_test.dart
          flutter analyze
          flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: phase04-normalized-sources
          path: |
            services/api/src/auth
            services/api/src/dev
            apps/web/src/features/auth
            apps/web/src/styles/auth.css
            scripts/auth-smoke.mjs
            packages/api-contract/openapi/boardops-v1.yaml
            docs/api/CONTRACT.md
            package.json
            services/api/package.json
            apps/mobile/lib/features/auth
            apps/mobile/lib/routing/app_router.dart
            apps/mobile/test/app_test.dart
            apps/mobile/pubspec.lock
          if-no-files-found: error
