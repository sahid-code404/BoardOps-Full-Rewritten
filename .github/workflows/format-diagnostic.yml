name: Format diagnostic

on:
  push:
    branches: ['phase/04-authentication-foundation']
    paths:
      - '.github/workflows/format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format new Phase 04 sources
        run: |
          pnpm prettier --write services/api/src/auth services/api/src/dev apps/web/src/features/auth apps/web/src/styles/auth.css
      - uses: actions/upload-artifact@v4
        with:
          name: phase04-formatted-sources
          path: |
            services/api/src/auth
            services/api/src/dev
            apps/web/src/features/auth
            apps/web/src/styles/auth.css
          if-no-files-found: error
